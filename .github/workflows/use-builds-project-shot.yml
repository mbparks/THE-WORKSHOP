name: Use Builds overview for project tour image

on:
  push:
    branches:
      - tour-framing-fix

permissions:
  contents: write

jobs:
  update-project-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tour-framing-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "CHROMIUM_PATH=$(command -v "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          echo "CHROMIUM_PATH=$(command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"
      - name: Point Projects tour image at Builds overview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/capture-tour.js')
          text = path.read_text(encoding='utf-8')
          old = "await route(cdp,'#/projects');await shot(cdp,'03-project')"
          new = "await route(cdp,'#/builds');await shot(cdp,'03-project')"
          if old not in text:
              raise SystemExit('Expected project-index capture route was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Regenerate screenshots
        run: node scripts/capture-tour.js
      - name: Verify and test
        shell: bash
        run: |
          set -euo pipefail
          test -f public/tour/screens/03-project.webp
          test "$(stat -c%s public/tour/screens/03-project.webp)" -gt 20000
          grep -q "await route(cdp,'#/builds');await shot(cdp,'03-project')" scripts/capture-tour.js
          git diff --check
          npm test
      - name: Upload screenshot review
        uses: actions/upload-artifact@v4
        with:
          name: workshop-tour-builds-preview
          path: public/tour/screens/03-project.webp
          if-no-files-found: error
          retention-days: 3
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/use-builds-project-shot.yml
          git add scripts/capture-tour.js public/tour/screens
          git commit -m "Use Builds overview in public tour"
          git push origin HEAD:tour-framing-fix
