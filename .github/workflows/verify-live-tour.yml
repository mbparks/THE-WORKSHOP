name: Verify live Workshop tour

on:
  push:
    branches:
      - public-workshop-tour

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify deployed Workshop and tour assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://workshop.greenshoegarage.com'
          for n in $(seq 1 30); do
            if curl -fsSL --max-time 20 "$base/tour" -o /tmp/tour.html; then break; fi
            sleep 2
          done
          grep -q '<title>Tour THE WORKSHOP' /tmp/tour.html
          grep -q 'See the whole Workshop before you join' /tmp/tour.html
          curl -fsSL --max-time 20 "$base/tour/tour.css" -o /tmp/tour.css
          grep -q -- '--accent:#93bda4' /tmp/tour.css
          curl -fsSL --max-time 20 "$base/tour/tour.js" -o /tmp/tour.js
          grep -q 'shot-dialog' /tmp/tour.js
          curl -fsSL --max-time 20 "$base/tour/screens/01-home.webp" -o /tmp/home.webp
          test "$(wc -c </tmp/home.webp)" -gt 20000
          file /tmp/home.webp | grep -qi webp
          curl -fsSL --max-time 20 "$base/api/health" -o /tmp/health.json
          grep -q 'ok' /tmp/health.json

      - name: Verify the live Workshop still renders in Chromium
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=12000 --dump-dom 'https://workshop.greenshoegarage.com/#/home' > /tmp/workshop-dom.html
          grep -q 'id="route-view"' /tmp/workshop-dom.html
          grep -q 'WHAT ARE YOU' /tmp/workshop-dom.html
          ! grep -q 'THE WORKSHOP could not finish starting' /tmp/workshop-dom.html
