name: Verify live Workshop tour framing v2

on:
  push:
    branches:
      - tour-live-visual-verify

permissions:
  contents: read

jobs:
  verify-live-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tour-live-visual-verify

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "CHROMIUM_PATH=$(command -v "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          echo "CHROMIUM_PATH=$(command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"

      - name: Verify deployed source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/live-tour-check
          base='https://workshop.greenshoegarage.com'
          for n in $(seq 1 60); do
            if curl -fsSL --max-time 20 "$base/tour?verify=$n" -o /tmp/live-tour-check/tour.html \
              && grep -q '/tour/screens/01-home-activity.webp' /tmp/live-tour-check/tour.html; then
              break
            fi
            sleep 2
          done
          grep -q '/tour/screens/01-home.webp' /tmp/live-tour-check/tour.html
          grep -q '/tour/screens/01-home-activity.webp' /tmp/live-tour-check/tour.html
          grep -q 'THE WORKSHOP Projects index showing active work' /tmp/live-tour-check/tour.html
          curl -fsSL --max-time 20 "$base/tour/tour.css?verify=$(date +%s)" -o /tmp/live-tour-check/tour.css
          grep -q 'TOUR FRAMING REFINEMENT v2' /tmp/live-tour-check/tour.css
          grep -q 'object-fit:contain!important' /tmp/live-tour-check/tour.css
          for name in 01-home 01-home-activity 02-bench 03-project; do
            curl -fsSL --max-time 20 "$base/tour/screens/$name.webp?verify=$(date +%s)" -o "/tmp/live-tour-check/$name.webp"
            test "$(stat -c%s "/tmp/live-tour-check/$name.webp")" -gt 20000
          done
          cmp -s /tmp/live-tour-check/01-home.webp /tmp/live-tour-check/01-home-activity.webp && exit 1 || true

      - name: Verify rendered geometry and capture production
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verify-live-tour.js <<'NODE'
          'use strict';
          const {spawn}=require('node:child_process');
          const fs=require('node:fs');
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          class CDP{
            constructor(url){this.url=url;this.ws=null;this.id=1;this.pending=new Map();}
            async connect(){await new Promise((resolve,reject)=>{const ws=this.ws=new WebSocket(this.url);const timer=setTimeout(()=>reject(new Error('CDP connection timeout')),10000);ws.addEventListener('open',()=>{clearTimeout(timer);resolve();},{once:true});ws.addEventListener('error',event=>{clearTimeout(timer);reject(event.error||new Error('CDP error'));},{once:true});ws.addEventListener('message',event=>this.onMessage(event.data));});}
            onMessage(raw){const message=JSON.parse(String(raw));if(!message.id)return;const pending=this.pending.get(message.id);if(!pending)return;this.pending.delete(message.id);message.error?pending.reject(new Error(message.error.message)):pending.resolve(message.result||{});}
            send(method,params={}){return new Promise((resolve,reject)=>{const id=this.id++;this.pending.set(id,{resolve,reject});this.ws.send(JSON.stringify({id,method,params}));});}
            close(){try{this.ws?.close();}catch{}}
          }
          async function waitFor(url,tries=120){for(let i=0;i<tries;i++){try{const response=await fetch(url);if(response.ok)return response;}catch{}await sleep(100);}throw new Error(`Timed out waiting for ${url}`);}
          async function evaluate(cdp,expression){const result=await cdp.send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(result.exceptionDetails)throw new Error(result.exceptionDetails.exception?.description||result.exceptionDetails.text||'Evaluation failed');return result.result?.value;}
          async function waitCondition(cdp,expression,label,timeout=25000){const start=Date.now();while(Date.now()-start<timeout){try{if(await evaluate(cdp,`Boolean(${expression})`))return;}catch{}await sleep(120);}throw new Error(`Timed out: ${label}`);}
          async function screenshot(cdp,name){const result=await cdp.send('Page.captureScreenshot',{format:'png',fromSurface:true});fs.writeFileSync(`/tmp/live-tour-check/${name}.png`,Buffer.from(result.data,'base64'));}
          async function inspect(cdp,selector){
            await waitCondition(cdp,`document.querySelector(${JSON.stringify(selector)})?.complete&&document.querySelector(${JSON.stringify(selector)})?.naturalWidth>0`,`${selector} loaded`);
            return evaluate(cdp,`(()=>{const image=document.querySelector(${JSON.stringify(selector)});const rect=image.getBoundingClientRect();const style=getComputedStyle(image);return {src:new URL(image.src).pathname,alt:image.alt,naturalWidth:image.naturalWidth,naturalHeight:image.naturalHeight,width:rect.width,height:rect.height,ratio:rect.width/rect.height,fit:style.objectFit,position:style.objectPosition};})()`);
          }
          (async()=>{
            const port=9341;
            const chrome=spawn(process.env.CHROMIUM_PATH,[`--remote-debugging-port=${port}`,'--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--hide-scrollbars','--no-first-run','--no-default-browser-check','--window-size=1440,1000','--user-data-dir=/tmp/live-tour-chrome-v2','about:blank'],{stdio:'ignore'});
            let cdp;
            try{
              await waitFor(`http://127.0.0.1:${port}/json/version`);
              const target=await (await fetch(`http://127.0.0.1:${port}/json/new?about:blank`,{method:'PUT'})).json();
              cdp=new CDP(target.webSocketDebuggerUrl);await cdp.connect();
              await Promise.all([cdp.send('Page.enable'),cdp.send('Runtime.enable'),cdp.send('Network.enable')]);
              await cdp.send('Page.navigate',{url:`https://workshop.greenshoegarage.com/tour?render=${Date.now()}`});
              await waitCondition(cdp,`document.readyState==='complete'`,'document ready');
              await sleep(900);
              const result={title:await evaluate(cdp,'document.title'),horizontalOverflow:await evaluate(cdp,'document.documentElement.scrollWidth-innerWidth')};
              result.hero=await inspect(cdp,'.hero-shot img');
              await screenshot(cdp,'live-top');
              for(const [id,key,name] of [['overview','overview','live-overview'],['bench','bench','live-bench'],['projects','projects','live-projects']]){
                await evaluate(cdp,`document.querySelector('#${id}')?.scrollIntoView({block:'start',behavior:'instant'});true`);
                await sleep(700);
                result[key]=await inspect(cdp,`#${id} .screen-card img`);
                await screenshot(cdp,name);
              }
              const near=(value,target,tolerance=.04)=>Math.abs(value-target)<=tolerance;
              if(!result.title.includes('Tour THE WORKSHOP'))throw new Error('Wrong document title.');
              if(result.hero.src!=='/tour/screens/01-home.webp')throw new Error(`Unexpected hero image: ${result.hero.src}`);
              if(result.overview.src!=='/tour/screens/01-home-activity.webp')throw new Error(`Unexpected overview image: ${result.overview.src}`);
              if(result.hero.src===result.overview.src)throw new Error('Opening screenshots are still duplicates.');
              for(const key of ['hero','overview','bench','projects']){
                const item=result[key];
                if(item.naturalWidth!==1600||item.naturalHeight!==1000)throw new Error(`${key} has unexpected source dimensions: ${item.naturalWidth}x${item.naturalHeight}`);
                if(item.fit!=='contain')throw new Error(`${key} is not using contain framing.`);
                if(!near(item.ratio,1.6))throw new Error(`${key} has unexpected display ratio ${item.ratio}.`);
              }
              if(result.horizontalOverflow>2)throw new Error(`Horizontal overflow: ${result.horizontalOverflow}px`);
              if(!result.projects.alt.includes('Projects index'))throw new Error('Projects image is not the updated overview.');
              fs.writeFileSync('/tmp/live-tour-check/metrics.json',JSON.stringify(result,null,2));
              console.log(JSON.stringify(result,null,2));
            }finally{try{cdp?.close();}catch{}try{chrome.kill('SIGKILL');}catch{}}
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
          node /tmp/verify-live-tour.js

      - name: Upload live visual verification
        uses: actions/upload-artifact@v4
        with:
          name: live-workshop-tour-verification-v2
          path: /tmp/live-tour-check
          if-no-files-found: error
          retention-days: 3
