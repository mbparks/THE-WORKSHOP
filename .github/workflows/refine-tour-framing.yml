name: Refine and verify Workshop tour framing

on:
  push:
    branches:
      - tour-framing-fix

permissions:
  contents: write

jobs:
  refine-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out refinement branch
        uses: actions/checkout@v4
        with:
          ref: tour-framing-fix
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "CHROMIUM_PATH=$(command -v "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          if command -v chromium-browser >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v chromium-browser)" >> "$GITHUB_ENV"
          else
            echo "CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          fi

      - name: Refine screenshot framing and remove duplicate opening image
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          capture = Path('scripts/capture-tour.js')
          text = capture.read_text(encoding='utf-8')
          replacements = {
              "'--window-size=1440,960'": "'--window-size=1600,1000'",
              "width:1440,height:960,deviceScaleFactor:1,mobile:false": "width:1600,height:1000,deviceScaleFactor:1,mobile:false",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing capture marker: {old}')
              text = text.replace(old, new, 1)

          old_sequence = "    await route(cdp,'#/home');await shot(cdp,'01-home');\n    await route(cdp,'#/bench');await shot(cdp,'02-bench');"
          new_sequence = "    await route(cdp,'#/home');await shot(cdp,'01-home');\n    await evalx(cdp,`(()=>{const nodes=[...document.querySelectorAll('h2,h3,[data-section-title]')];const target=nodes.find(node=>/AROUND THE WORKSHOP/i.test(node.textContent||''));if(target)target.scrollIntoView({block:'start',behavior:'instant'});else window.scrollTo(0,Math.max(560,innerHeight*.7));return true})()`);\n    await sleep(450);await shot(cdp,'01-home-activity');\n    await route(cdp,'#/bench');await shot(cdp,'02-bench');"
          if old_sequence not in text:
              raise SystemExit('Could not find screenshot sequence.')
          text = text.replace(old_sequence, new_sequence, 1)
          capture.write_text(text, encoding='utf-8')

          html_path = Path('public/tour/index.html')
          html = html_path.read_text(encoding='utf-8')
          overview_start = html.index('<section id="overview"')
          overview_end = html.index('</section>', overview_start)
          overview = html[overview_start:overview_end]
          if overview.count('/tour/screens/01-home.webp') != 2:
              raise SystemExit('Expected two Home screenshot references in overview section.')
          overview = overview.replace('/tour/screens/01-home.webp', '/tour/screens/01-home-activity.webp')
          overview = overview.replace(
              'Home keeps the focus on work, community activity, and useful next steps.',
              'Around the Workshop shows meaningful project, Crew, and Live activity without becoming an endless feed.'
          )
          overview = overview.replace(
              'alt="THE WORKSHOP Home screen"',
              'alt="THE WORKSHOP Home screen scrolled to Around the Workshop activity and useful next steps"'
          )
          html = html[:overview_start] + overview + html[overview_end:]
          html = html.replace('width="1440" height="960"', 'width="1600" height="1000"')
          html_path.write_text(html, encoding='utf-8')

          css_path = Path('public/tour/tour.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* TOUR FRAMING REFINEMENT v2 */'
          if marker in css:
              css = css[:css.index(marker)].rstrip() + '\n'
          override = base64.b64decode('').decode('utf-8')
          css_path.write_text(css.rstrip() + '\n\n' + override, encoding='utf-8')
          PY

      - name: Regenerate real demo screenshots
        run: node scripts/capture-tour.js

      - name: Verify source and screenshot outputs
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/capture-tour.js
          node --check public/tour/tour.js
          test -f public/tour/screens/01-home-activity.webp
          test "$(find public/tour/screens -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')" = "14"
          test "$(stat -c%s public/tour/screens/01-home-activity.webp)" -gt 20000
          grep -q 'TOUR FRAMING REFINEMENT v2' public/tour/tour.css
          grep -q 'height:auto!important' public/tour/tour.css
          grep -q '/tour/screens/01-home-activity.webp' public/tour/index.html
          test "$(grep -o '/tour/screens/01-home-activity.webp' public/tour/index.html | wc -l | tr -d ' ')" = "2"
          git diff --check

      - name: Run complete application QA
        run: npm test

      - name: Create visual review captures
        shell: bash
        run: |
          set -euo pipefail
          PORT=49177 HOST=127.0.0.1 WORKSHOP_DATA_DIR=/tmp/workshop-tour-preview-data WORKSHOP_DEV_AUTH=1 WORKSHOP_SEED_DEMO=1 NODE_ENV=development node server.js >/tmp/tour-preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for n in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:49177/tour >/dev/null; then break; fi
            sleep .1
          done
          mkdir -p /tmp/tour-preview
          for target in top overview bench projects; do
            anchor=''
            case "$target" in
              overview) anchor='#overview' ;;
              bench) anchor='#bench' ;;
              projects) anchor='#projects' ;;
            esac
            "$CHROMIUM_PATH" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,1000 --user-data-dir="/tmp/chrome-$target" --screenshot="/tmp/tour-preview/$target.png" "http://127.0.0.1:49177/tour$anchor"
          done
          cp public/tour/screens/01-home.webp /tmp/tour-preview/
          cp public/tour/screens/01-home-activity.webp /tmp/tour-preview/
          cp public/tour/screens/02-bench.webp /tmp/tour-preview/
          cp public/tour/screens/03-project.webp /tmp/tour-preview/

      - name: Upload visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: workshop-tour-framing-preview
          path: /tmp/tour-preview
          if-no-files-found: error
          retention-days: 3

      - name: Commit verified refinement and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-tour-framing.yml
          git add scripts/capture-tour.js public/tour/index.html public/tour/tour.css public/tour/screens
          git commit -m "Improve public tour screenshot framing"
          git push origin HEAD:tour-framing-fix
