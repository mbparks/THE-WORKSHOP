name: Improve project tour screenshot

on:
  push:
    branches:
      - tour-framing-fix

permissions:
  contents: write

jobs:
  improve-project-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tour-framing-fix
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "CHROMIUM_PATH=$(command -v "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          echo "CHROMIUM_PATH=$(command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"

      - name: Use the project index for the Projects tour image
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          capture = Path('scripts/capture-tour.js')
          text = capture.read_text(encoding='utf-8')
          old = "    await route(cdp,'#/projects/p_lora');await shot(cdp,'03-project');\n    await shot(cdp,'04-project-talk',{selector:'#project-discussion'});"
          new = "    await route(cdp,'#/projects');await shot(cdp,'03-project');\n    await route(cdp,'#/projects/p_lora');await shot(cdp,'04-project-talk',{selector:'#project-discussion'});"
          if old not in text:
              raise SystemExit('Could not find project screenshot sequence.')
          capture.write_text(text.replace(old, new, 1), encoding='utf-8')

          page = Path('public/tour/index.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace(
              'data-caption="A Project gathers its current stage, story, Notebook, files, team, and shareable result."',
              'data-caption="The Projects index makes active, collaborative, and completed work easy to scan before opening a workspace."',
              1
          )
          html = html.replace(
              'alt="Electronics Project page for a fictional LoRa environmental sensor"',
              'alt="THE WORKSHOP Projects index showing active work across several maker practices"',
              1
          )
          html = html.replace(
              '<figcaption><strong>PROJECT WORKSPACE</strong><span>Document the work as it changes</span></figcaption>',
              '<figcaption><strong>PROJECTS</strong><span>Active work · shared work · completed work</span></figcaption>',
              1
          )
          page.write_text(html, encoding='utf-8')
          PY

      - name: Regenerate real demo screenshots
        run: node scripts/capture-tour.js

      - name: Verify and test
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/capture-tour.js
          test -f public/tour/screens/03-project.webp
          test "$(stat -c%s public/tour/screens/03-project.webp)" -gt 20000
          grep -q "await route(cdp,'#/projects');await shot(cdp,'03-project')" scripts/capture-tour.js
          grep -q 'THE WORKSHOP Projects index showing active work' public/tour/index.html
          git diff --check
          npm test

      - name: Upload project screenshot review
        uses: actions/upload-artifact@v4
        with:
          name: workshop-tour-project-preview
          path: public/tour/screens/03-project.webp
          if-no-files-found: error
          retention-days: 3

      - name: Commit verified project screenshot and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/improve-project-tour-shot.yml
          git add scripts/capture-tour.js public/tour/index.html public/tour/screens
          git commit -m "Improve Projects tour screenshot"
          git push origin HEAD:tour-framing-fix
