name: Apply THE FORGE navigation safely

on:
  push:
    branches:
      - forge-nav-apply

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the stable branch
        uses: actions/checkout@v4
        with:
          ref: forge-nav-apply
          fetch-depth: 0

      - name: Add THE FORGE above ALMANAC
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/index.html')
          html = path.read_text(encoding='utf-8')
          url = 'https://forge.greenshoegarage.com'
          needle = '          <div class="side-secondary-label">MORE</div>\n'
          link = '          <a class="external-nav-link" href="https://forge.greenshoegarage.com" target="_blank" rel="noopener noreferrer"><span class="nav-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 7h14l-2 4H7L5 7Z"/><path d="M8 11h8l2 3H6l2-3Z"/><path d="M10 14v5h4v-5"/></svg></span>THE FORGE <span class="external-mark" aria-hidden="true">↗</span></a>\n'

          if url not in html:
              if html.count(needle) != 1:
                  raise SystemExit('Expected exactly one MORE navigation marker.')
              html = html.replace(needle, needle + link, 1)
              path.write_text(html, encoding='utf-8')

          if html.count(url) != 1 or html.count('>THE FORGE <') != 1:
              raise SystemExit('THE FORGE link was not added exactly once.')
          if html.index(url) > html.index('https://mbparks.com/almanac'):
              raise SystemExit('THE FORGE is not above ALMANAC.')
          PY

      - name: Verify this is a one-file navigation patch
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "public/index.html"
          test "$(git diff --numstat -- public/index.html | awk '{print $1":"$2}')" = "1:0"
          grep -q 'https://forge.greenshoegarage.com' public/index.html
          grep -q '<script src="/app.js?v=9.0.4" defer></script>' public/index.html

      - name: Commit the verified patch and remove this temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/forge-nav-apply.yml
          git add public/index.html
          git commit -m "Add THE FORGE above ALMANAC"
          git push origin HEAD:forge-nav-apply
